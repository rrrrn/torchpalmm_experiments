[project]
name = "torchpalmm-experiments"
version = "0.1.0"
description = "Simulation, scaling and real-data analyses for torchpalmm"
requires-python = ">=3.9"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "torch",
    "tqdm",
    "scipy",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["simulation_experiments"]
include = ["simscripts*"]   # torchpalmm/ is a standalone project (its own pyproject)
